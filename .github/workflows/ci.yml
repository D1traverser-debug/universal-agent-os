name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'state/evolution/**'
      - 'docs/assurance/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: uaos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test contracts and architecture invariants
        run: pytest
