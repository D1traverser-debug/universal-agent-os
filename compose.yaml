services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: uaos
      POSTGRES_USER: uaos
      POSTGRES_PASSWORD: uaos-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uaos -d uaos"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - uaos-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: uaos-minio
      MINIO_ROOT_PASSWORD: uaos-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - uaos-minio:/data

volumes:
  uaos-postgres:
  uaos-minio:
